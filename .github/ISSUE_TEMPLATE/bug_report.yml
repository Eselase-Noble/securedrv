name: Bug report
description: Report a problem with Cipherjet
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please include enough detail to reproduce.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `cipherjet --version`
      placeholder: cipherjet 1.1.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what actually occurred.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      render: shell
