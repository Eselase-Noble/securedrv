# =============================================================================
#  Claude code review — automated AI review on every pull request.
#  Activates only when an ANTHROPIC_API_KEY repository secret is present; until
#  then the review step is skipped (a cheap gate step decides). Add the secret in
#  Settings -> Secrets and variables -> Actions to turn it on.
# =============================================================================
name: Claude code review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      # secrets can't be used in a job-level `if:`, so gate here instead.
      - name: Check for API key
        id: gate
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false (no ANTHROPIC_API_KEY secret; skipping)"
            echo "on=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.on == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review
        if: steps.gate.outputs.on == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
