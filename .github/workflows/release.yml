# =============================================================================
#  Release — build prebuilt Cipherjet binaries and attach them to a GitHub
#  Release whenever a version tag (e.g. v1.0.0) is pushed.
#
#      git tag v1.0.0 && git push origin v1.0.0
#
#  Builds on four targets and publishes stable, version-independent asset names
#  so the website can link to them permanently via /releases/latest/download/<a>:
#      cipherjet-linux-x86_64.tar.gz
#      cipherjet-macos-x86_64.tar.gz   (Intel)
#      cipherjet-macos-arm64.tar.gz    (Apple Silicon)
#      cipherjet-windows-x86_64.zip    (statically linked .exe, no DLLs needed)
#  Unix tarballs contain the binaries, install scripts, README + LICENSE; the
#  Windows zip contains the .exe files, README + LICENSE.
# =============================================================================
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-13 = Intel, macos-14 = Apple Silicon, ubuntu = Linux, windows = MSVC
        os: [ ubuntu-latest, macos-13, macos-14, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libsodium-dev cmake pkg-config g++

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libsodium cmake pkg-config

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install libsodium:x64-windows-static-md
        shell: pwsh

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ctest --test-dir build --output-on-failure

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          cmake --build build --config Release -j
          ctest --test-dir build -C Release --output-on-failure

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          case "$(uname -s)" in Darwin) OSL=macos;; Linux) OSL=linux;; *) OSL="$(uname -s)";; esac
          ARCH="$(uname -m)"
          ASSET="cipherjet-${OSL}-${ARCH}.tar.gz"
          PKG="cipherjet-${VERSION}-${OSL}-${ARCH}"
          mkdir -p "dist/$PKG/bin" "dist/$PKG/install"
          cp build/cipherjet build/cipherjet-release build/cipherjet-keygen \
             build/cipherjet-send build/cipherjet-server "dist/$PKG/bin/"
          cp install/install-cups-printer.sh install/uninstall-cups-printer.sh "dist/$PKG/install/"
          cp README.md LICENSE "dist/$PKG/"
          tar -C dist -czf "$ASSET" "$PKG"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME
          $ASSET = "cipherjet-windows-x86_64.zip"
          $PKG = "dist/cipherjet-$VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$PKG/bin" | Out-Null
          Copy-Item build/Release/cipherjet.exe,build/Release/cipherjet-release.exe,build/Release/cipherjet-keygen.exe,build/Release/cipherjet-send.exe,build/Release/cipherjet-server.exe "$PKG/bin/"
          Copy-Item README.md,LICENSE "$PKG/"
          Compress-Archive -Path "$PKG" -DestinationPath $ASSET -Force
          "ASSET=$ASSET" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
