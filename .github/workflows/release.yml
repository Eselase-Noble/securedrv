# =============================================================================
#  Release — build prebuilt Cipherjet binaries and attach them to a GitHub
#  Release whenever a version tag (e.g. v1.0.0) is pushed.
#
#      git tag v1.0.0 && git push origin v1.0.0
#
#  Builds on four targets and publishes stable, version-independent asset names
#  so the website can link to them permanently via /releases/latest/download/<a>:
#      cipherjet-linux-x86_64.tar.gz
#      cipherjet-macos-x86_64.tar.gz   (Intel)
#      cipherjet-macos-arm64.tar.gz    (Apple Silicon)
#      cipherjet-windows-x86_64.zip    (statically linked .exe, no DLLs needed)
#  Unix tarballs contain the binaries, install scripts, README + LICENSE; the
#  Windows zip contains the .exe files, README + LICENSE.
# =============================================================================
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Signing turns on automatically once the matching secrets are configured;
    # until then these are empty and the sign/notarize steps are skipped.
    #   macOS:   MACOS_CERT_P12 (base64 .p12), MACOS_CERT_PASSWORD,
    #            MACOS_SIGN_IDENTITY ("Developer ID Application: NAME (TEAMID)")
    #            + notarization: AC_API_KEY_ID, AC_API_ISSUER_ID, AC_API_KEY_P8 (base64)
    #   Windows: WINDOWS_CERT_PFX (base64 .pfx), WINDOWS_CERT_PASSWORD
    env:
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_MACOS_NOTARY: ${{ secrets.AC_API_KEY_P8 != '' }}
      HAS_WIN_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    strategy:
      fail-fast: false
      matrix:
        # macos-13 = Intel, macos-14 = Apple Silicon, ubuntu = Linux, windows = MSVC
        os: [ ubuntu-latest, macos-13, macos-14, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake g++ make curl

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install libsodium:x64-windows-static-md
        shell: pwsh

      # Build a STATIC libsodium from source so the released Unix binaries carry
      # no runtime dependency on a system libsodium.
      - name: Build static libsodium (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL -o libsodium.tar.gz \
            https://download.libsodium.org/libsodium/releases/libsodium-1.0.20-stable.tar.gz
          tar xzf libsodium.tar.gz
          cd libsodium-stable
          ./configure --enable-static --disable-shared --prefix="$HOME/sodium"
          make -j
          make install

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCIPHERJET_SODIUM_ROOT="$HOME/sodium"
          cmake --build build -j
          ctest --test-dir build --output-on-failure

      # Code-sign the macOS binaries with a Developer ID cert (skipped if no cert).
      - name: Sign (macOS)
        if: runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p ci "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import cert.p12 -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          for b in cipherjet cipherjet-release cipherjet-keygen cipherjet-send cipherjet-server; do
            codesign --force --options runtime --timestamp \
                     --sign "$MACOS_SIGN_IDENTITY" "build/$b"
          done
          rm -f cert.p12

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          cmake --build build --config Release -j
          ctest --test-dir build -C Release --output-on-failure

      # Authenticode-sign the Windows .exe files (skipped if no cert).
      - name: Sign (Windows)
        if: runner.os == 'Windows' && env.HAS_WIN_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = (Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin/*/x64/signtool.exe" | Select-Object -Last 1).FullName
          Get-ChildItem build/Release/cipherjet*.exe | ForEach-Object {
            & $signtool sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }
          Remove-Item cert.pfx

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          case "$(uname -s)" in Darwin) OSL=macos;; Linux) OSL=linux;; *) OSL="$(uname -s)";; esac
          ARCH="$(uname -m)"
          ASSET="cipherjet-${OSL}-${ARCH}.tar.gz"
          PKG="cipherjet-${VERSION}-${OSL}-${ARCH}"
          mkdir -p "dist/$PKG/bin" "dist/$PKG/install"
          cp build/cipherjet build/cipherjet-release build/cipherjet-keygen \
             build/cipherjet-send build/cipherjet-server "dist/$PKG/bin/"
          cp install/install-cups-printer.sh install/uninstall-cups-printer.sh \
             install/cipherjet.ppd "dist/$PKG/install/"
          cp README.md LICENSE "dist/$PKG/"
          tar -C dist -czf "$ASSET" "$PKG"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          # Native double-click installer for this OS.
          if [ "$OSL" = "macos" ]; then
            bash packaging/build-macos-pkg.sh "cipherjet-macos-${ARCH}.pkg"
          elif [ "$OSL" = "linux" ]; then
            bash packaging/build-linux-deb.sh "cipherjet-linux-amd64.deb"
          fi

      # Notarize the signed macOS binaries with Apple so Gatekeeper clears them on
      # download (skipped unless notarization secrets are present).
      - name: Notarize (macOS)
        if: runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true' && env.HAS_MACOS_NOTARY == 'true'
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: |
          echo "$AC_API_KEY_P8" | base64 --decode > key.p8
          ditto -c -k --keepParent dist notarize.zip
          xcrun notarytool submit notarize.zip \
            --key key.p8 --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" --wait
          rm -f key.p8 notarize.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME
          $ASSET = "cipherjet-windows-x86_64.zip"
          $PKG = "dist/cipherjet-$VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$PKG/bin" | Out-Null
          Copy-Item build/Release/cipherjet.exe,build/Release/cipherjet-release.exe,build/Release/cipherjet-keygen.exe,build/Release/cipherjet-send.exe,build/Release/cipherjet-server.exe "$PKG/bin/"
          Copy-Item packaging/windows-install.ps1 "$PKG/install.ps1"
          Copy-Item README.md,LICENSE "$PKG/"
          Compress-Archive -Path "$PKG" -DestinationPath $ASSET -Force
          "ASSET=$ASSET" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
            *.pkg
            *.deb
          generate_release_notes: true
