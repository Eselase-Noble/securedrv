# =============================================================================
#  Release — build prebuilt Cipherjet binaries and attach them to a GitHub
#  Release whenever a version tag (e.g. v1.0.0) is pushed.
#
#      git tag v1.0.0 && git push origin v1.0.0
#
#  Builds on three targets — Linux x86_64, macOS Intel, macOS Apple Silicon —
#  and publishes stable, version-independent asset names so the website can link
#  to them permanently via /releases/latest/download/<asset>:
#      cipherjet-linux-x86_64.tar.gz
#      cipherjet-macos-x86_64.tar.gz   (Intel)
#      cipherjet-macos-arm64.tar.gz    (Apple Silicon)
#  Each tarball contains the three binaries, the install scripts, README + LICENSE.
# =============================================================================
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-13 = Intel, macos-14 = Apple Silicon, ubuntu-latest = Linux x86_64
        os: [ ubuntu-latest, macos-13, macos-14 ]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libsodium-dev cmake pkg-config g++

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libsodium cmake pkg-config

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          case "$(uname -s)" in Darwin) OSL=macos;; Linux) OSL=linux;; *) OSL="$(uname -s)";; esac
          ARCH="$(uname -m)"
          # Stable asset name (no version) so /releases/latest/download links never break.
          ASSET="cipherjet-${OSL}-${ARCH}.tar.gz"
          # Versioned folder inside the tarball for provenance.
          PKG="cipherjet-${VERSION}-${OSL}-${ARCH}"
          mkdir -p "dist/$PKG/bin" "dist/$PKG/install"
          cp build/cipherjet build/cipherjet-release build/cipherjet-keygen "dist/$PKG/bin/"
          cp install/install-cups-printer.sh install/uninstall-cups-printer.sh "dist/$PKG/install/"
          cp README.md LICENSE "dist/$PKG/"
          tar -C dist -czf "$ASSET" "$PKG"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
