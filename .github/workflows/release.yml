# =============================================================================
#  Release — build prebuilt Cipherjet binaries and attach them to a GitHub
#  Release whenever a version tag (e.g. v1.0.0) is pushed.
#
#      git tag v1.0.0 && git push origin v1.0.0
#
#  Produces cipherjet-<version>-<os>-<arch>.tar.gz containing the three binaries
#  plus the install scripts, so users can download and run:
#      tar xzf cipherjet-*.tar.gz && sudo ./install/install-cups-printer.sh
# =============================================================================
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libsodium-dev cmake pkg-config g++

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libsodium cmake pkg-config

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"
          PKG="cipherjet-${VERSION}-${OS}-${ARCH}"
          mkdir -p "dist/$PKG/bin" "dist/$PKG/install"
          cp build/cipherjet build/cipherjet-release build/cipherjet-keygen "dist/$PKG/bin/"
          cp install/install-cups-printer.sh install/uninstall-cups-printer.sh "dist/$PKG/install/"
          cp README.md LICENSE "dist/$PKG/"
          tar -C dist -czf "${PKG}.tar.gz" "$PKG"
          echo "ASSET=${PKG}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
