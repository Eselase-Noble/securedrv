# =============================================================================
#  Pages — publish the Cipherjet website (docs/) to GitHub Pages.
#
#  One-time: in the repo, Settings ▸ Pages ▸ "Build and deployment" ▸
#  Source = "GitHub Actions". After that this deploys on every push to main
#  that touches docs/. Live URL: https://eselase-noble.github.io/securedrv/
# =============================================================================
name: Pages

on:
  push:
    branches: [ main ]
    paths: [ 'docs/**', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
